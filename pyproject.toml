[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "pharma_sales_analysis"
version = "0.0.1"
description = "Analysis of pharm data to ansswer simple questions given."
authors = [
  { name = "Gowri Shankar" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["pharma_sales_analysis"]
include = ["pyproject.toml", "pharma_sales_analysis/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["pharma_sales_analysis"]
force-sort-within-sections = true

